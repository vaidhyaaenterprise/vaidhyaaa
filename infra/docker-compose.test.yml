services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: vaidya-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaidya_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vaidya_test']
      interval: 2s
      timeout: 5s
      retries: 15
